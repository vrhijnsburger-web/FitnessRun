document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

red\"?','MOE','BOOS','BLIJ'],\n    ['Wat is \"enkel\" (lichaam) in het Engels?','ANKLE','UNCLE','ANGLE'],\n    ['Wat betekent \"throw\"?','GOOIEN','VANGEN','SCHOPPEN'],\n    ['Wat is \"verliezen\" in het Engels?','LOSE','LOOSE','LEAVE']\n  ],\n  LOGICA: [\n    ['2, 4, 8, 16, … ?','32','24','20'],\n    ['1, 1, 2, 3, 5, 8, … ?','13','11','12'],\n    ['Welke maand heeft 28 dagen?','ALLEMAAL','FEBRUARI','GEEN'],\n    ['Een boer heeft 10 schapen. Alle behalve 3 lopen weg. Hoeveel blijven er over?','3','7','0'],\n    ['Hoeveel vlakken heeft een kubus?','6','8','12'],\n    ['Wat is zwaarder: 1 kg veren of 1 kg ijzer?','EVEN ZWAAR','IJZER','VEREN'],\n    ['3, 6, 9, 12, … ?','15','14','18']\n  ]\n};\nconst DESC = {\n  'BURPEES': 'Hurk, spring naar plankhouding, terug en spring omhoog',\n  'JUMPING JACKS': 'Spring benen wijd en armen boven je hoofd, en weer terug',\n  'PUSH-UPS': 'Lichaam recht, borst naar de grond en duw omhoog',\n  'SIT-UPS': 'Op je rug, knieën gebogen, kom omhoog naar je knieën',\n  'SQUATS': 'Billen naar achter en omlaag, hielen op de grond',\n  'LUNGES': 'Grote stap naar voren, achterste knie bijna op de grond',\n  'MOUNTAIN CLIMBERS': 'In plankhouding je knieën om en om snel naar je borst',\n  'HIGH KNEES': 'Op de plaats rennen met je knieën hoog',\n  'SHOULDER TAPS': 'In plankhouding om en om je andere schouder aantikken',\n  'SQUAT JUMPS': 'Diep door je knieën en explosief omhoog springen',\n  'PLANK JACKS': 'In plankhouding je benen wijd en weer samen springen',\n  'BICYCLE CRUNCHES': 'Op je rug, elleboog naar de andere knie, om en om',\n  'FROG JUMPS': 'Diep hurken, handen op de grond, ver naar voren springen',\n  'SKATERS': 'Zijwaarts van been naar been springen, als een schaatser',\n  'STAR JUMPS': 'Spring omhoog met armen en benen wijd als een ster',\n  'WALKING LUNGES': 'Lunges achter elkaar, steeds een stap vooruit',\n  'BEAR CRAWL STEPS': 'Op handen en voeten stappen, knieën net boven de grond',\n  'CRAB WALK STEPS': 'Buik omhoog, op handen en voeten achteruit stappen',\n  'CALF RAISES': 'Op je tenen omhoog komen en langzaam zakken',\n  'SUPERMAN': 'Op je buik, armen en benen tegelijk optillen',\n  'HIGH-FIVES': 'Tegenover elkaar: samen omhoog springen en high-five in de lucht',\n  'PARTNER SQUATS': 'Rug tegen rug, armen in elkaar, samen door de knieën',\n  'MEDICINE BALL PASSES': 'Gooi de medicijnbal naar elkaar over en vang hem',\n  'SYNCHRO BURPEES': 'Naast elkaar een burpee, precies tegelijk',\n  'PUSH-UP CLAPS': 'Tegenover elkaar in push-up, na elke push-up hand tegen hand',\n  'PARTNER SIT-UPS': 'Voeten tegen elkaar, samen omhoog en high-five',\n  'BOKSPRINGEN': 'Eén maakt zich klein, de ander springt eroverheen, wissel',\n  'KRUIWAGEN STAPPEN': 'Eén stapt op de handen, de ander houdt de enkels vast. Daarna wisselen'\n};\nconst CATS = ['REKENEN','SPORT','KENNIS','ENGELS','LOGICA','AARDRIJKSKUNDE','GESCHIEDENIS','BIOLOGIE','NATUURKUNDE'];\nconst TEAMS = ['1','2','3','4','5','6'];\nconst ANS_COL = ['oklch(0.88 0.15 95)', 'oklch(0.82 0.13 210)', 'oklch(0.8 0.14 330)'];\nconst TEAM_COL = ['oklch(0.8 0.15 25)','oklch(0.88 0.15 95)','oklch(0.82 0.15 150)','oklch(0.82 0.13 210)','oklch(0.8 0.14 330)','oklch(0.84 0.15 60)'];\nconst oklchGold = 'oklch(0.88 0.15 95)';\nconst BLUE = 'oklch(0.46 0.13 255)', RED = 'oklch(0.66 0.21 25)', GREEN = 'oklch(0.82 0.17 150)', DARK = 'oklch(0.3 0.1 255)';\nconst QUIZ_MS = 10000, FAST_MS = 4000, KEY = 'runrep-settings-v1';\nconst OUT_F = { fast: 0.6, slow: 1, wrong: 1.45, late: 1.45 };\nconst LEVEL_F = { easy: 0.7, normal: 1, hard: 1.3 };\nconst rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));\nconst pick = a => a[Math.floor(Math.random() * a.length)];\nconst shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };\nconst DEFAULTS = { points: true, target: 0, grade: 'o', catsV: 2, partner: 0.6, quiz: false, level: 'normal', duration: 0, groups: 4, sound: true, off: [], cats: CATS.slice() };\nfunction load() {\n  try { const saved = JSON.parse(localStorage.getItem(KEY) || '{}'); if (saved.catsV !== 2) { delete saved.cats; } return { ...DEFAULTS, ...saved, catsV: 2 }; }\n  catch (e) { return { ...DEFAULTS }; }\n}\n\nconst IMG_CACHE = {};\nfunction imgUrl(p) {\n  if (IMG_CACHE[p]) return IMG_CACHE[p];\n  const d = (window.FR_IMG || {})[p];\n  if (!d) return p;\n  try {\n    const bin = atob(d.split(',')[1]), u = new Uint8Array(bin.length), mime = d.slice(5, d.indexOf(';'));\n    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);\n    return (IMG_CACHE[p] = URL.createObjectURL(new Blob([u], { type: mime })));\n  } catch (e) { return p; }\n}\nconst fmt = n => String(n).replace('-', '−');\nfunction mathQ(grade) {\n  let text, ans, trap;\n  if (grade === 'b') {\n    const k = rnd(0, 6);\n    if (k === 0) { const a = rnd(12, 25), b = rnd(3, 9); text = a + ' × ' + b; ans = a * b; }\n    else if (k === 1) { const a = rnd(11, 16); text = a + '²'; ans = a * a; trap = a * 2; }\n    else if (k === 2) { const p = pick([15, 20, 30, 75]), n = pick([40, 60, 80, 120, 160, 200, 240, 300, 400]); text = p + '% van ' + n; ans = n * p / 100; }\n    else if (k === 3) { const a = -rnd(5, 20), b = rnd(8, 30); text = fmt(a) + ' + ' + b; ans = a + b; }\n    else if (k === 4) { const a = rnd(6, 15); text = '√' + (a * a); ans = a; }\n    else if (k === 5) { const a = rnd(2, 20), b = rnd(2, 9), c = rnd(2, 9); text = a + ' + ' + b + ' × ' + c; ans = a + b * c; trap = (a + b) * c; }\n    else { const [t, nn] = pick([[1, 3], [2, 3], [3, 4], [2, 5], [3, 5]]), n = nn * rnd(3, 12); text = t + '/' + nn + ' van ' + n; ans = n / nn * t; }\n  } else {\n    const k = rnd(0, 4);\n    if (k === 0) { const a = rnd(3, 10), b = rnd(3, 10); text = a + ' × ' + b; ans = a * b; }\n    else if (k === 1) { const a = rnd(18, 79), b = rnd(12, 59); text = a + ' + ' + b; ans = a + b; }\n    else if (k === 2) { const a = rnd(60, 140), b = rnd(12, 49); text = a + ' − ' + b; ans = a - b; }\n    else if (k === 3) { const p = pick([10, 25, 50]), n = pick([40, 80, 120, 200, 240, 360]); text = p + '% van ' + n; ans = n * p / 100; }\n    else { const n = rnd(30, 99) * 2; text = 'De helft van ' + n; ans = n / 2; }\n  }\n  const wrong = new Set();\n  if (trap !== undefined && trap !== ans) wrong.add(trap);\n  while (wrong.size < 2) { const d = ans + pick([-1, 1]) * rnd(1, 10); if (d !== ans && (ans < 0 || d > 0)) wrong.add(d); }\n  return { cat: 'REKENEN', text: text + ' = ?', right: fmt(ans), wrong: [...wrong].map(fmt), big: true };\n}\n\nclass Component extends DCLogic {\n  state = { phase: 'idle', rot: 0, task: null, team: -1, q: null, qStart: 0, picked: -1, outcome: null, elapsed: 0,\n    now: Date.now(), roundEnd: null, showSettings: false, s: load(), vw: window.innerWidth, vh: window.innerHeight, history: [], scores: [0, 0, 0, 0, 0, 0], winner: null, ending: false, lastPts: 0 };\n  componentDidMount() {\n    this.onResize = () => this.setState({ vw: window.innerWidth, vh: window.innerHeight });\n    window.addEventListener('resize', this.onResize);\n    this.onKey = e => {\n      if (this.state.warm == null) return;\n      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); this.warmStep(1); }\n      else if (e.key === 'ArrowLeft') this.warmStep(-1);\n      else if (e.key === 'Escape') this.setState({ warm: null });\n    };\n    window.addEventListener('keydown', this.onKey);\n    this.iv = setInterval(() => this.tick(), 100);\n    if (window.FR_QUESTIONS) this.bank = window.FR_QUESTIONS;\n    else fetch('questions.json').then(r => r.json()).then(b => { this.bank = b; }).catch(() => {});\n  }\n  warmList() { const s = this.state.s; const l = EX.filter(e => !s.off.includes(e[0]) && (!e[5] || s.partner > 0)); return l.length ? l : EX; }\n  warmStep(d) {\n    const n = this.warmList().length, i = (this.state.warm || 0) + d;\n    if (i >= n) return this.setState({ warm: null });\n    if (i < 0) return;\n    this.wdir = d; this.setState({ warm: i });\n  }\n  componentWillUnmount() { clearTimeout(this.winTm); window.removeEventListener('keydown', this.onKey); window.removeEventListener('resize', this.onResize); clearInterval(this.iv); clearTimeout(this.tm); }\n  tick() {\n    const st = this.state, now = Date.now();\n    if (st.phase === 'quiz' && now - st.qStart >= QUIZ_MS) return this.resolve(-1);\n    if (st.roundEnd && now >= st.roundEnd && (st.phase === 'idle' || st.phase === 'result')) { this.beep(330, 0.4, 'triangle'); return this.setState({ phase: 'done', roundEnd: null, now }); }\n    if (st.phase === 'quiz' || st.roundEnd) this.setState({ now });\n  }\n  save(patch) {\n    const s = { ...this.state.s, ...patch };\n    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}\n    this.setState({ s });\n  }\n  audio() {\n    if (!this.state.s.sound) return null;\n    try { this.ac = this.ac || new (window.AudioContext || window.webkitAudioContext)(); if (this.ac.state === 'suspended') this.ac.resume(); return this.ac; } catch (e) { return null; }\n  }\n  beep(freq, dur, type, to) {\n    const ac = this.audio(); if (!ac) return;\n    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;\n    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);\n    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);\n    g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);\n    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);\n  }\n  busy() { const p = this.state.phase; return this.state.ending || p === 'spin' || p === 'quiz' || p === 'feedback' || p === 'done'; }\n  genTask(f) {\n    const s = this.state.s, m = f * LEVEL_F[s.level];\n    const SOLO = EX.filter(e => !e[5]);\n    let pool = SOLO.filter(e => !s.off.includes(e[0])); if (pool.length < 2) pool = SOLO;\n    const reps = pool.filter(e => !e[4]).length >= 2 ? pool.filter(e => !e[4]) : SOLO.filter(e => !e[4]);\n    const ppool = EX.filter(e => e[5] && !s.off.includes(e[0]));\n    const mk = e => { let c = Math.round(rnd(e[2], e[3]) * m); if (e[4]) c = Math.max(10, Math.round(c / 5) * 5); return { name: e[0], ini: e[1], desc: DESC[e[0]] || '', img: 'img/' + e[0].toLowerCase().replace(/ /g, '-') + '.png', count: Math.max(3, c), unit: e[4] || '' }; };\n    for (let tries = 0; tries < 12; tries++) {\n      let t;\n      if (ppool.length && Math.random() < (s.partner || 0)) t = { ...mk(pick(ppool)), tag: 'PARTNER ROUND' };\n      else if (!s.quiz && Math.random() < 0.1) {\n        const kind = pick(['DOUBLE', 'TEAM', 'SPEED', 'SLOW']);\n        if (kind === 'DOUBLE') { const x = pick(reps), y = pick(reps.filter(e => e !== x)), b = mk(y); t = { ...mk(x), tag: 'DOUBLE', second: '+ ' + b.count + ' ' + b.name }; }\n        else if (kind === 'TEAM') { const e = pick(reps); t = { ...mk(e), count: Math.round(e[3] * 2 * m), tag: 'TEAM', note: 'VERDEEL SAMEN' }; }\n        else if (kind === 'SPEED') t = { ...mk(pick(reps)), tag: 'SPEED', note: 'ZO SNEL MOGELIJK' };\n        else t = { ...mk(pick(reps)), tag: 'SLOW', note: 'HEEL LANGZAAM UITVOEREN' };\n      } else t = mk(pick(pool));\n      if (!this.last || t.name !== this.last.name || t.count !== this.last.count) return t;\n    }\n    return mk(pick(pool));\n  }\n  makeQ() {\n    const s = this.state.s, g = s.grade === 'b' ? 'b' : 'o';\n    const cats = s.cats.length ? s.cats : CATS;\n    let cat = pick(cats);\n    if (cat === this.lastCat && cats.length > 1) cat = pick(cats.filter(c => c !== cat));\n    this.lastCat = cat;\n    let q;\n    const list = this.bank && this.bank[cat] ? this.bank[cat][g] : (g === 'o' ? BANK[cat] : null);\n    if (cat === 'REKENEN' || !list || !list.length) q = mathQ(g);\n    else {\n      this.decks = this.decks || {};\n      const key = cat + g;\n      if (!this.decks[key] || !this.decks[key].length) this.decks[key] = shuffle(list.map((_, i) => i));\n      const r = list[this.decks[key].pop()];\n      q = { cat, text: r[0], right: r[1], wrong: [r[2], r[3]] };\n    }\n    q.answers = shuffle([{ label: q.right, correct: true }, ...q.wrong.map(w => ({ label: w, correct: false }))]);\n    return q;\n  }\n  start(team) {\n    if (this.busy()) return;\n    const st = this.state;\n    const roundEnd = st.roundEnd || (st.s.duration ? Date.now() + st.s.duration * 60000 : null);\n    if (st.s.quiz) {\n      this.beep(520, 0.12, 'triangle', 780);\n      this.setState({ phase: 'quiz', team, q: this.makeQ(), qStart: Date.now(), now: Date.now(), picked: -1, outcome: null, roundEnd });\n    } else {\n      this.beep(300, 0.5, 'sawtooth', 900);\n      const t = this.genTask(1);\n      this.setState(s => ({ phase: 'spin', team, outcome: null, rot: s.rot + 720 + rnd(0, 359), roundEnd }));\n      clearTimeout(this.tm);\n      this.tm = setTimeout(() => { this.finish(t); this.beep(880, 0.12); }, 800);\n    }\n  }\n  resolve(i) {\n    const st = this.state; if (st.phase !== 'quiz') return;\n    const el = Date.now() - st.qStart;\n    const outcome = i < 0 ? 'late' : !st.q.answers[i].correct ? 'wrong' : el <= FAST_MS ? 'fast' : 'slow';\n    if (outcome === 'fast' || outcome === 'slow') this.beep(880, 0.18, 'sine', 1320); else this.beep(200, 0.3, 'square', 140);\n    const pts = st.s.points ? (outcome === 'fast' ? 2 : outcome === 'slow' ? 1 : 0) : 0;\n    const idx = Math.max(0, st.team), scores = st.scores.slice(); scores[idx] += pts;\n    this.setState({ phase: 'feedback', picked: i, outcome, elapsed: el, scores, lastPts: pts });\n    const t = this.genTask(OUT_F[outcome]);\n    if (outcome === 'fast') t.count = Math.min(t.count, 3);\n    if (outcome === 'slow') t.count = Math.min(t.count, 5);\n    if (st.s.points && st.s.target && scores[idx] >= st.s.target) {\n      this.setState({ ending: true });\n      clearTimeout(this.winTm);\n      this.winTm = setTimeout(() => { this.beep(660, 0.5, 'triangle', 1320); this.setState({ phase: 'done', winner: idx, ending: false, roundEnd: null }); }, 4500);\n    }\n    clearTimeout(this.tm);\n    this.tm = setTimeout(() => this.finish(t), 650);\n  }\n  finish(t) { this.last = t; this.setState(s => ({ phase: 'result', task: t, history: [{ id: (this.hid = (this.hid || 0) + 1), team: s.team, t }, ...(s.history || [])].slice(0, 12) })); }\n  newRound() { clearTimeout(this.tm); clearTimeout(this.winTm); this.setState({ phase: 'idle', task: null, team: -1, roundEnd: null, showSettings: false, history: [], scores: [0, 0, 0, 0, 0, 0], winner: null, ending: false }); }\n  renderVals() {\n    const st = this.state, s = st.s, ph = st.phase;\n    const land = st.vw > st.vh * 1.15;\n    const L = land\n      ? { bodyDir: 'row', padDir: 'column', padW: 'min(24vw,320px)', padH: 'auto', wheel: 'min(40vw,62vh)', tile: 'min(26vw,44vh)', tileFs: 'min(12vw,20vh)', imgW: 'min(34vw,59.5vh)', imgH: 'min(20vw,35vh)', resDir: 'row', ansDir: 'row' }\n      : { bodyDir: 'column', padDir: 'row', padW: '100%', padH: 'min(17vh,190px)', wheel: 'min(72vw,44vh)', tile: 'min(30vw,21vh)', tileFs: 'min(13.8vw,9.6vh)', imgW: 'min(78.2vw,37.4vh)', imgH: 'min(46vw,22vh)', resDir: 'column', ansDir: 'column' };\n    const teamsOn = s.groups > 0, busy = this.busy(), pointsOn = !!(s.points && s.quiz);\n    const nT = teamsOn ? s.groups : 1;\n    const order = Array.from({ length: nT }, (_, i) => i).sort((a, b) => st.scores[b] - st.scores[a]);\n    let place = 0;\n    const ranking = pointsOn ? order.map((i, k) => {\n      if (k === 0 || st.scores[i] < st.scores[order[k - 1]]) place = k + 1;\n      return { place: place + 'E', label: teamsOn ? 'TEAM ' + TEAMS[i] : 'SCORE', score: st.scores[i] + ' PT',\n        bg: teamsOn ? TEAM_COL[i] : '#fff', border: place === 1 ? '#fff' : 'transparent' };\n    }) : [];\n    const top = order[0], tie = nT > 1 && st.scores[order[1]] === st.scores[top];\n    let doneTitle = 'TIJD OM!', doneSub = 'IEDEREEN TERUG NAAR DE GROEP';\n    if (pointsOn && st.winner != null) { doneTitle = teamsOn ? 'TEAM ' + TEAMS[st.winner] + ' WINT!' : 'DOEL GEHAALD!'; doneSub = s.target + ' PUNTEN GEHAALD'; }\n    else if (pointsOn && teamsOn && st.scores[top] > 0) { doneTitle = 'TIJD OM!'; doneSub = tie ? 'GELIJKSPEL!' : 'TEAM ' + TEAMS[top] + ' WINT MET ' + st.scores[top] + ' PUNTEN'; }\n    const warmOn = st.warm != null, wl = this.warmList(), we = wl[Math.min(st.warm || 0, wl.length - 1)];\n    const wImg = 'img/' + we[0].toLowerCase().replace(/ /g, '-') + '.png';\n    const w = { name: we[0], desc: DESC[we[0]] || '', isDuo: !!we[5], num: (st.warm || 0) + 1, total: wl.length,\n      bgImg: 'url(\"' + imgUrl(wImg) + '\")',\n      nextLabel: (st.warm || 0) >= wl.length - 1 ? 'KLAAR ✓' : 'VOLGENDE →', prevOp: (st.warm || 0) === 0 ? 0.4 : 1,\n      anim: ((st.warm || 0) % 2 ? 'rr-new0' : 'rr-new1') + ' .3s ease-out' };\n    L.warmW = land ? 'min(42vw,72vh)' : 'min(86vw,46vh)';\n    L.warmH = land ? 'min(24.7vw,42.4vh)' : 'min(50.6vw,27vh)';\n    const pads = teamsOn\n      ? TEAMS.slice(0, s.groups).map((n, i) => ({ isTeam: true, isSingle: false, big: n, bg: TEAM_COL[i], fg: DARK, onClick: () => this.start(i),\n          hasScore: pointsOn, score: st.scores[i] + (s.target ? ' / ' + s.target : '') + ' PT' }))\n      : [{ isTeam: false, isSingle: true, big: s.quiz ? 'DRUK VOOR VRAAG' : 'DRUK VOOR OPDRACHT', bg: RED, fg: '#fff', onClick: () => this.start(-1) }];\n    const hasTeam = teamsOn && st.team >= 0;\n    const teamLabel = hasTeam ? 'TEAM ' + TEAMS[st.team] : '', teamBg = hasTeam ? TEAM_COL[st.team] : '#fff';\n\n    const q = st.q || { cat: '', text: '', answers: [] };\n    const el = Math.min(QUIZ_MS, st.now - st.qStart);\n    const answers = (q.answers || []).map((a, i) => {\n      let bg = ANS_COL[i] || '#fff', fg = DARK;\n      if (ph === 'feedback') {\n        if (a.correct) { bg = GREEN; fg = DARK; } else if (i === st.picked) { bg = RED; fg = '#fff'; } else { bg = '#ffffff2a'; fg = '#ffffffaa'; }\n      }\n      return { label: a.label, letter: 'ABC'[i], bg, fg, onClick: () => this.resolve(i) };\n    });\n    c r: '#ffffff26', anim: 'none' });\n    let timerText = '';\n    if (st.roundEnd) { const r = Math.max(0, Math.ceil((st.roundEnd - st.now) / 1000)); timerText = Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0'); }\n    else if (s.duration) timerText = s.duration + ':00';\n\n    const seg = (title, opts, cur, key) => ({ title, items: opts.map(([label, v]) => ({ label, bg: v === cur ? '#fff' : 'transparent', fg: v === cur ? DARK : '#fff', onClick: () => this.save({ [key]: v }) })) });\n    const segRows = [\n      seg('MODUS', [['SNEL (RAD)', false], ['QUIZ', true]], s.quiz, 'quiz'),\n      seg('KLAS (MOEILIJKHEID VRAGEN)', [['ONDERBOUW 1–3', 'o'], ['BOVENBOUW 4–6', 'b']], s.grade, 'grade'),\n      seg('TEAMS', [['UIT', 0], ['3', 3], ['4', 4], ['5', 5], ['6', 6]], s.groups, 'groups'),\n      seg('DUO-OPDRACHTEN (PARTNER ROUND)', [['UIT', 0], ['SOMS', 0.3], ['VAAK', 0.6], ['ALTIJD', 1]], s.partner, 'partner'),\n      seg('NIVEAU', [['MAKKELIJK', 'easy'], ['NORMAAL', 'normal'], ['ZWAAR', 'hard']], s.level, 'level'),\n      { title: 'DUUR · ' + (s.duration ? s.duration + ' MINUTEN' : 'VRIJ SPELEN'), items: [\n        { label: '−', bg: 'transparent', fg: '#fff', onClick: () => this.save({ duration: Math.max(0, (s.duration || 0) - 1) }) },\n        { label: s.duration ? s.duration + ' MIN' : 'VRIJ', bg: '#fff', fg: DARK, onClick: () => { const v = window.prompt('Duur in minuten (0 = vrij spelen)', String(s.duration || '')); if (v === null) return; const n = Math.round(parseFloat(String(v).replace(',', '.'))); if (!isNaN(n)) this.save({ duration: Math.min(120, Math.max(0, n)) }); } },\n        { label: '+', bg: 'transparent', fg: '#fff', onClick: () => this.save({ duration: Math.min(120, (s.duration || 0) + 1) }) },\n        ...[['5', 5], ['10', 10], ['15', 15], ['20', 20], ['VRIJ', 0]].map(([label, v]) => ({ label, bg: 'transparent', fg: '#ffffffcc', onClick: () => this.save({ duration: v }) }))\n      ] },\n      seg('PUNTEN (ALLEEN IN QUIZ) · SNEL GOED = 2, GOED = 1', [['AAN', true], ['UIT', false]], s.points, 'points'),\n      { title: 'SPELEN TOT · ' + (s.target ? s.target + ' PUNTEN' : 'GEEN MAXIMUM'), items: [\n        { label: '−', bg: 'transparent', fg: '#fff', onClick: () => this.save({ target: Math.max(0, (s.target || 0) - 1) }) },\n        { label: s.target ? s.target + ' PT' : 'GEEN', bg: '#fff', fg: DARK, onClick: () => { const v = window.prompt('Spelen tot hoeveel punten? (0 = geen maximum)', String(s.target || '')); if (v === null) return; const n = Math.round(parseFloat(String(v).replace(',', '.'))); if (!isNaN(n)) this.save({ target: Math.min(500, Math.max(0, n)) }); } },\n        { label: '+', bg: 'transparent', fg: '#fff', onClick: () => this.save({ target: Math.min(500, (s.target || 0) + 1) }) },\n        ...[['10', 10], ['20', 20], ['30', 30], ['50', 50], ['GEEN', 0]].map(([label, v]) => ({ label, bg: 'transparent', fg: '#ffffffcc', onClick: () => this.save({ target: v }) }))\n      ] },\n      seg('GELUID', [['AAN', true], ['UIT', false]], s.sound, 'sound'),\n      { title: 'QUIZVRAGEN', items: CATS.map(c => { const on = s.cats.includes(c); return { label: c, bg: on ? '#fff' : 'transparent', fg: on ? DARK : '#fff', onClick: () => { const n = on ? s.cats.filter(x => x !== c) : [...s.cats, c]; if (n.length) this.save({ cats: n }); } }; }) }\n    ];\n    const exItems = EX.map(e => { const on = !s.off.includes(e[0]); return { label: e[0] + (e[5] ? ' · DUO' : ''), mark: on ? '✓' : '', box: on ? '#fff' : 'transparent', op: on ? 1 : 0.55,\n      onClick: () => { const off = on ? [...s.off, e[0]] : s.off.filter(x => x !== e[0]); if (EX.length - off.length >= 3) this.save({ off }); } }; });\n\n    return {\n      w, showWarm: warmOn, showWarmBtn: !warmOn && (ph === 'idle' || ph === 'result'),\n      startWarm: () => { clearTimeout(this.tm); this.setState({ warm: 0, showSettings: false, phase: st.phase === 'done' ? 'idle' : (this.busy() ? 'idle' : st.phase) }); },\n      stopWarm: () => this.setState({ warm: null }),\n      warmNext: () => this.warmStep(1), warmPrev: () => this.warmStep(-1),\n      L, quizOn: s.quiz, hasTimer: !!(st.roundEnd || s.duration), timerText,\n      showWheel: !warmOn && (ph === 'idle' || ph === 'spin'), spinTeam: ph === 'spin' && hasTeam, rot: st.rot,\n      showQuiz: !warmOn && (ph === 'quiz' || ph === 'feedback'), q: { cat: q.cat, text: q.text, fs: qfs }, answers,\n      barPct: ph === 'quiz' ? Math.max(0, 100 - el / QUIZ_MS * 100) : 0, barColor: el <= FAST_MS ? GREEN : '#fff',\n      showResult: !warmOn && ph === 'result',\n      history, hasHistory: !warmOn && ph !== 'done',\n      t: { ...t, bgImg: t.img ? 'url(\"' + imgUrl(t.img) + '\")' : 'none', hasImg: !!t.img, noImg: !t.img, hasDesc: !!t.desc, hasUnit: !!t.unit, hasSecond: !!t.second, hasNote: !!t.note },\n      pills, hasPills: pills.length > 0, answerNote, hasAnswerNote: !!answerNote,\n      hasTeam, teamLabel, teamBg,\n      doneTitle, doneSub, ranking, hasRanking: ranking.length > 0,\n      showDone: !warmOn && ph === 'done', showPads: !warmOn && ph !== 'done', pads, padOpacity: busy ? 0.4 : 1,\n      showSettings: st.showSettings, openSettings: () => this.setState({ showSettings: true }), closeSettings: () => this.setState({ showSettings: false }),\n      newRound: () => this.newRound(), segRows, exItems, exCount: EX.length - s.off.length\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
